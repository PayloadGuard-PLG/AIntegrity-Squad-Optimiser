name: Resource Coach Screenshot Replay

on:
  pull_request:
    paths:
      - 'profiles/resource_coach_current_replay_20260923.json'
      - 'tools/resource-coach-v2/corpus_holdout_validation.py'
      - 'tests/test_resource_coach_corpus_holdout.py'
      - 'calibration/resource-coach-identification/archived-preview-rows-v1.json'
      - 'calibration/resource-coach-identification/chat-locked-tests-20260923.json'
      - 'calibration/longitudinal-corpus/canonical-corpus-v1.json.gz.b64'
      - 'calibration/resource-coach-log/quality-exclusions.json'
      - '.github/workflows/resource-coach-corpus-holdout.yml'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Deterministic spotlight anchor→target pair'
        required: false
        default: 'vader-20260924-rerun-2'

permissions:
  contents: read

jobs:
  replay-current-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Static checks
        run: |
          python -m py_compile             tools/resource-coach-v2/corpus_holdout_validation.py             tests/test_resource_coach_corpus_holdout.py

      - name: Replay invariants
        run: |
          python -m unittest discover -s tests -p 'test_resource_coach_corpus_holdout.py'

      - name: Run screenshot-grounded leave-one-coach-out replay
        env:
          REPLAY_SEED: ${{ inputs.seed || 'vader-20260924-rerun-2' }}
        run: |
          rm -rf /tmp/resource-coach-current-replay
          mkdir -p /tmp/resource-coach-current-replay
          python tools/resource-coach-v2/corpus_holdout_validation.py             --seed "$REPLAY_SEED"             --out-dir /tmp/resource-coach-current-replay

          {
            cat /tmp/resource-coach-current-replay/REPORT.md
            echo
            echo '## Reproducibility'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Seed: \`$REPLAY_SEED\`"
            echo "- Python: 3.12"
            echo "- No model fitting package or stochastic optimiser is used."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify audit bundle
        run: |
          test -s /tmp/resource-coach-current-replay/summary.json
          test -s /tmp/resource-coach-current-replay/REPORT.md
          test -s /tmp/resource-coach-current-replay/primary-predictions.csv
          test -s /tmp/resource-coach-current-replay/primary-anchor-calibrations.csv
          test -s /tmp/resource-coach-current-replay/canonical-predictions.csv
          test -s /tmp/resource-coach-current-replay/canonical-anchor-calibrations.csv
          test -s /tmp/resource-coach-current-replay/global-baseline-predictions.csv

      - name: Upload replay bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-coach-current-model-replay
          path: /tmp/resource-coach-current-replay
          if-no-files-found: error
          retention-days: 30
