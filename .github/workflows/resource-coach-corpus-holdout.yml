name: Resource Coach Corpus Holdout

on:
  pull_request:
    paths:
      - 'tools/resource-coach-v2/corpus_holdout_validation.py'
      - 'tools/resource-coach-v2/system_identification.py'
      - 'tests/test_resource_coach_corpus_holdout.py'
      - 'tests/test_resource_coach_system_identification.py'
      - 'tests/resource-coach-chat-locked-tests-20260923-test.mjs'
      - 'calibration/resource-coach-identification/**'
      - 'calibration/longitudinal-corpus/**'
      - '.github/workflows/resource-coach-corpus-holdout.yml'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Deterministic seed for the spotlight player'
        required: false
        default: 'vader-20260923'
      player:
        description: 'Optional exact player id or name; blank uses the seeded choice'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  seeded-holdout:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install deterministic research dependencies
        run: |
          python -m pip install --disable-pip-version-check             numpy==2.2.6             scipy==1.15.3

      - name: Static checks
        run: |
          python -m py_compile             tools/resource-coach-v2/system_identification.py             tools/resource-coach-v2/corpus_holdout_validation.py             tests/test_resource_coach_system_identification.py             tests/test_resource_coach_corpus_holdout.py

      - name: Research invariants
        run: |
          python -m unittest discover -s tests -p 'test_resource_coach_system_identification.py'
          python -m unittest discover -s tests -p 'test_resource_coach_corpus_holdout.py'
          node --test tests/resource-coach-chat-locked-tests-20260923-test.mjs

      - name: Reproduce current system-identification ledger
        run: |
          mkdir -p /tmp/resource-coach-holdout
          python tools/resource-coach-v2/system_identification.py             --out /tmp/resource-coach-holdout/research-replay.json

      - name: Seeded player holdout and corpus-wide LOPO
        env:
          HOLDOUT_SEED: ${{ inputs.seed || 'vader-20260923' }}
          HOLDOUT_PLAYER: ${{ inputs.player || '' }}
        run: |
          args=(
            --seed "$HOLDOUT_SEED"
            --out-dir /tmp/resource-coach-holdout
          )
          if [ -n "$HOLDOUT_PLAYER" ]; then
            args+=(--player "$HOLDOUT_PLAYER")
          fi

          python tools/resource-coach-v2/corpus_holdout_validation.py "${args[@]}"

          {
            echo
            cat /tmp/resource-coach-holdout/REPORT.md
            echo
            echo '## Reproducibility'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Seed: \`$HOLDOUT_SEED\`"
            if [ -n "$HOLDOUT_PLAYER" ]; then
              echo "- Explicit player override: \`$HOLDOUT_PLAYER\`"
            fi
            echo "- BLAS threads: 1"
            echo "- NumPy: 2.2.6"
            echo "- SciPy: 1.15.3"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify artifact completeness
        run: |
          test -s /tmp/resource-coach-holdout/summary.json
          test -s /tmp/resource-coach-holdout/REPORT.md
          test -s /tmp/resource-coach-holdout/selected-player-predictions.csv
          test -s /tmp/resource-coach-holdout/all-player-lopo-predictions.csv
          test -s /tmp/resource-coach-holdout/canonical-holdout-predictions.csv
          test -s /tmp/resource-coach-holdout/per-player-fold-summary.csv
          test -s /tmp/resource-coach-holdout/research-replay.json

      - name: Upload holdout audit bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-coach-corpus-holdout
          path: /tmp/resource-coach-holdout
          if-no-files-found: error
          retention-days: 30
