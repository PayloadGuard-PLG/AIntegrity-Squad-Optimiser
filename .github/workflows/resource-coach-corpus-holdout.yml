name: Resource Coach Direct Player-Card Replay

on:
  pull_request:
    paths:
      - 'profiles/resource_coach_current_replay_20260923.json'
      - 'profiles/resource_coach_structure_candidate_20260924.json'
      - 'profiles/resource_coach_structure_candidate_20260924b.json'
      - 'tools/resource-coach-v2/direct_player_card_validation.py'
      - 'tools/resource-coach-v2/structure_audit.py'
      - 'tests/test_resource_coach_direct_validation.py'
      - 'tests/test_resource_coach_structure_audit.py'
      - 'calibration/resource-coach-identification/**'
      - 'calibration/longitudinal-corpus/canonical-corpus-v1.json.gz.b64'
      - 'calibration/resource-coach-log/quality-exclusions.json'
      - '.github/workflows/resource-coach-corpus-holdout.yml'
  push:
    branches-ignore:
      - main
    paths:
      - 'profiles/resource_coach_current_replay_20260923.json'
      - 'profiles/resource_coach_structure_candidate_20260924.json'
      - 'profiles/resource_coach_structure_candidate_20260924b.json'
      - 'tools/resource-coach-v2/direct_player_card_validation.py'
      - 'tools/resource-coach-v2/structure_audit.py'
      - 'tests/test_resource_coach_direct_validation.py'
      - 'tests/test_resource_coach_structure_audit.py'
      - 'calibration/resource-coach-identification/**'
      - 'calibration/longitudinal-corpus/canonical-corpus-v1.json.gz.b64'
      - 'calibration/resource-coach-log/quality-exclusions.json'
      - '.github/workflows/resource-coach-corpus-holdout.yml'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Deterministic single-event spotlight'
        required: false
        default: 'vader-direct-20260924'

permissions:
  contents: read

jobs:
  replay-current-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install structure-audit dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2'

      - name: Static checks
        run: |
          python -m py_compile \
            tools/resource-coach-v2/direct_player_card_validation.py \
            tools/resource-coach-v2/structure_audit.py \
            tests/test_resource_coach_direct_validation.py \
            tests/test_resource_coach_structure_audit.py

      - name: Direct replay invariants
        run: |
          python -m unittest discover -s tests -p 'test_resource_coach_direct_validation.py'
          python -m unittest discover -s tests -p 'test_resource_coach_structure_audit.py'

      - name: Run direct player-card replay
        env:
          REPLAY_SEED: ${{ inputs.seed || 'vader-direct-20260924' }}
        run: |
          rm -rf /tmp/resource-coach-direct-replay
          mkdir -p /tmp/resource-coach-direct-replay
          python tools/resource-coach-v2/direct_player_card_validation.py \
            --seed "$REPLAY_SEED" \
            --out-dir /tmp/resource-coach-direct-replay

          {
            cat /tmp/resource-coach-direct-replay/REPORT.md
            echo
            echo '## Reproducibility'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Seed: \`$REPLAY_SEED\`"
            echo "- Python: 3.12"
            echo "- Primary predictor uses frozen global C only; no observed target or anchor coach is fitted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run structure audit across the entire corpus (frozen vs young-grey candidate, every player)
        run: |
          python tools/resource-coach-v2/structure_audit.py \
            --out-dir /tmp/resource-coach-direct-replay/structure-audit \
            --seed 20260924 --permutations 500
          {
            echo
            cat /tmp/resource-coach-direct-replay/structure-audit/STRUCTURE_AUDIT.md
            echo
            echo "- Frozen baseline profile and frozen x59 predictions are verified byte-stable by the test suite."
            echo "- Current research candidate (not production): \`profiles/resource_coach_structure_candidate_20260924b.json\` (young-grey)."
            echo "- \`profiles/resource_coach_structure_candidate_20260924.json\` (N−1) is falsified and kept for the record."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify audit bundle
        run: |
          test -s /tmp/resource-coach-direct-replay/summary.json
          test -s /tmp/resource-coach-direct-replay/REPORT.md
          test -s /tmp/resource-coach-direct-replay/direct-predictions.csv
          test -s /tmp/resource-coach-direct-replay/event-inventory.csv
          test -s /tmp/resource-coach-direct-replay/quarantined-rows.csv
          test -s /tmp/resource-coach-direct-replay/structure-audit/structure-audit.json
          test -s /tmp/resource-coach-direct-replay/structure-audit/STRUCTURE_AUDIT.md
          test -s /tmp/resource-coach-direct-replay/structure-audit/candidate-direct-predictions.csv

      - name: Upload replay bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-coach-direct-player-card-replay
          path: /tmp/resource-coach-direct-replay
          if-no-files-found: error
          retention-days: 30
