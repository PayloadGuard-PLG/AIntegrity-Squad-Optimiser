name: Drill Coach Cross Transfer Research

on:
  push:
    branches:
      - research/drill-coach-cross-transfer-20260924
    paths:
      - 'tools/resource-coach-v2/drill_coach_transfer_20260924.py'
      - 'calibration/fractional-settlement/haggag-ordered-raw-20260924.json'
      - '.github/workflows/drill-coach-transfer-research.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/resource-coach-v2/drill_coach_transfer_20260924.py'
      - 'calibration/fractional-settlement/haggag-ordered-raw-20260924.json'
      - '.github/workflows/drill-coach-transfer-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - run: python -m py_compile tools/resource-coach-v2/drill_coach_transfer_20260924.py
      - name: Preserve production boundary
        run: |
          git diff 9dec1ef0beb666c638ea75f3b58b7a28eed5bf08...HEAD --name-only > /tmp/changed.txt
          if grep -E '^(src/|profiles/)' /tmp/changed.txt; then exit 1; fi
      - name: Reproduce ordered drill and coach transfer
        run: |
          python tools/resource-coach-v2/drill_coach_transfer_20260924.py --output /tmp/drill-coach-transfer.json > /tmp/transfer-stdout.json
          cat /tmp/transfer-stdout.json
          test -s /tmp/drill-coach-transfer.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drill-coach-cross-transfer
          path: /tmp/drill-coach-transfer.json
          if-no-files-found: error
          retention-days: 30
