name: EAS Update

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  payloadguard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: PayloadGuard Analysis
        uses: PayloadGuard-PLG/payload-consequence-analyser@d8435494e71ee713a7c7d4160bae182e14aef399
        with:
          # REQUIRED for Layer 5b (Semantic Transparency), which compares the PR's
          # stated intent against the measured severity of its diff. The action
          # cannot read the body itself by design — it takes it as an input, and
          # that input defaults to "". Omitting this does NOT fail the scan: it
          # silently reports UNVERIFIED and the run still comes back green, so the
          # one layer built to catch a low-impact description over a high-impact
          # diff is switched off without anything saying so. Every scan in this
          # repository ran that way until 2026-09-08.
          #
          # Safe to interpolate: the action assigns it to the PG_PR_DESCRIPTION
          # env var and expands it quoted, so the body never reaches the shell as
          # command text, and analyze.py sanitises it before parsing.
          pr-description: ${{ github.event.pull_request.body }}

  # Main remains the canonical preview source after merge.
  update:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push OTA update
        run: npx eas-cli update --branch preview --platform android --message "$COMMIT_MSG" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}

  # One physical preview build is currently pinned to the EAS "preview" channel.
  # Publish same-repository PR heads into that preview slot so changes can be
  # exercised on-device before merge. The latest PR publication intentionally
  # wins; a subsequent main push restores the merged state.
  update-pr-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: payloadguard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: eas-android-pr-preview
      cancel-in-progress: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck PR head
        run: npm run typecheck

      - name: Publish PR head to Android preview
        run: npx eas-cli update --channel preview --platform android --message "$COMMIT_MSG" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MSG: "PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.title }} · ${{ github.event.pull_request.head.sha }}"
