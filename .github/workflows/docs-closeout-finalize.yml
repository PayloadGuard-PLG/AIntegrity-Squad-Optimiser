name: Finalize Resource Coach V2 docs consistency

on:
  push:
    branches:
      - docs/resource-coach-v2-postmerge-20260913

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: docs/resource-coach-v2-postmerge-20260913
          fetch-depth: 0

      - name: Correct remaining stale current-state statements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{path}: expected text not found: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          replace(
              'CLAUDE.md',
              '**Never push to main directly** — main triggers EAS OTA to production devices. All work goes to the branch above; user merges via PR.',
              '**Never push to main directly** — main triggers EAS OTA to production devices. Development work goes to a task branch created from current `main`; user merges via reviewed PR.'
          )

          replace(
              'HANDOVER.md',
              '| COACHES | Scan coach → project coaching gains → apply | Tier section removed; coach scan auto-saves to history |',
              '| COACHES | Resource Coach V2 preview interval testing/calibration | Ordinary predicts; Reward/unresolved abstain; no predicted-stat writeback |'
          )
          replace(
              'HANDOVER.md',
              '| 5 | Slow talent — no confirmed data point | Slow (0.47) **invalidated Sprint 34** — derived from LJDark Leo ×114 using linear budget. With geometric budget (`sessionBudgetDecay=0.99`), LJDark Leo result is consistent with Normal (1.0). Back-calculate from a confirmed-Slow player. | High |',
              '| 5 | Legacy Slow talent multiplier | Slow (0.47) is invalidated. Fastest/Fast/Average/Normal/Slow in our app are manual empirical hypotheses, not automatically observed source-game fields. Establish any replacement only from independently evidenced before/after data. Resource Coach V2 does not use this selector. | High |'
          )
          replace(
              'HANDOVER.md',
              '| 6 | Fastest/Fast talent calibration | Currently community estimates (1.5 / 1.25). Needs known-talent players to confirm. | Medium |',
              '| 6 | Legacy non-Normal talent calibration | Existing non-Normal multipliers are community/legacy estimates. Do not treat the app selector as provenance; confirmation requires independent empirical evidence. | Medium |'
          )
          replace(
              'HANDOVER.md',
              '| 9 | LJDark Leo talent unknown | Playstyle icon ≠ talent. Check Personal Trainer tab for the explicit Fastest/Fast/Average/Normal/Slow label. Determines whether LJDark Leo is the Slow recalibration candidate. | High |',
              '| 9 | LJDark Leo talent provenance | Historical talent classification is unresolved. Do **not** request a supposed Training Rate/Personal Trainer screen or promote the app selector to observation. Reclassify only if independent source evidence is supplied. | Medium |'
          )

          replace(
              'README.md',
              '- 🎯 **Calibrated OVR Projections** — Models age, role, stat profile, and talent tier to project OVR outcomes for any combination of drill plans, coaching sessions, and tier upgrades — before you spend anything. Core constants (OVR formula, cost curve shape, age 18–20 and 26–28 brackets, Normal talent) are empirically confirmed from game screenshots. Several talent tiers and mid-range age brackets are still being validated — projections show a gain range, not a single guaranteed number.',
              '- 🎯 **Calibrated OVR Projections** — Models age, role and stat profile to project OVR outcomes for drill plans, legacy coaching paths and tier upgrades before you spend anything. Confirmed and assumed quantities are kept distinct; legacy Fastest/Fast/Average/Normal/Slow classifications remain empirical hypotheses unless independently evidenced, and Resource Coach V2 does not consume that selector.'
          )
          replace(
              'README.md',
              'The core logic — XP cost model, OVR projection formulas, role weight tables, and condition drain calculations — is reverse-engineered from real in-game data. Core constants are empirically confirmed; some talent multipliers and age brackets are still in calibration (see [`CLAUDE.md`](./CLAUDE.md) for the current status of every constant).',
              'The core logic — XP cost model, OVR projection formulas, role weight tables, condition drain calculations, and Resource Coach interval transfer — is reverse-engineered from observed data. Evidence grades and abstention boundaries matter as much as the fitted constants; legacy talent classifications remain hypotheses, while Resource Coach V2 deliberately excludes that field (see [`CLAUDE.md`](./CLAUDE.md) and [`PRINCIPIA.md`](./PRINCIPIA.md)).'
          )

          replace(
              'PRINCIPIA.md',
              '- One clean before/after from a player of *confirmed* non-Normal talent. Every\n  projection in the application currently rests on the assumption of Normal.',
              '- One clean before/after with independently evidenced non-Normal talent would\n  advance the **legacy training projection path**. The manual app selector alone is\n  not that evidence, and Resource Coach V2 does not consume it.'
          )

          p = Path('ASSUMPTIONS.md')
          s = p.read_text()
          s = s.replace('7. **PR title max 256 characters.** Put detail in the PR body.\n## Role Constraints',
                        '7. **PR title max 256 characters.** Put detail in the PR body.\n\n## Role Constraints', 1)
          p.write_text(s)
          PY

          git diff --check

      - name: Commit final docs consistency pass
        shell: bash
        run: |
          rm -f .github/workflows/docs-closeout-finalize.yml
          git config user.name "AIntegrity Docs Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: resolve stale Resource Coach provenance notes [skip ci]"
          git push origin HEAD:docs/resource-coach-v2-postmerge-20260913
