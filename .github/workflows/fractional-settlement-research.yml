name: Fractional Settlement Research

on:
  push:
    branches:
      - research/fractional-settlement-20260924
    paths:
      - 'tools/resource-coach-v2/fractional_settlement.py'
      - 'tools/resource-coach-v2/quantization_aware_refit.py'
      - 'calibration/fractional-settlement/**'
      - '.github/workflows/fractional-settlement-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settlement-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install replay dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2'

      - name: Compile research replay
        run: python -m py_compile tools/resource-coach-v2/fractional_settlement.py tools/resource-coach-v2/quantization_aware_refit.py

      - name: Run Haggag and Resource Coach settlement replay
        run: |
          rm -rf /tmp/fractional-settlement
          mkdir -p /tmp/fractional-settlement
          python tools/resource-coach-v2/fractional_settlement.py \
            --resource-pool --lopo \
            --out-dir /tmp/fractional-settlement \
            --json > /tmp/fractional-settlement/stdout.json
          cat /tmp/fractional-settlement/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run quantization-aware shape refit
        run: |
          python tools/resource-coach-v2/quantization_aware_refit.py \
            --out /tmp/fractional-settlement/quantization-aware-refit.json \
            --report /tmp/fractional-settlement/QUANTIZATION_AWARE_REFIT.md
          cat /tmp/fractional-settlement/QUANTIZATION_AWARE_REFIT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Freeze Haggag post-drill prospective predictions
        run: |
          python tools/resource-coach-v2/freeze_shape_test.py \
            --card calibration/fractional-settlement/haggag-postdrill-card-20260924.json \
            --out /tmp/fractional-settlement/haggag-postdrill-shape-predictions.json
          test -s /tmp/fractional-settlement/haggag-postdrill-shape-predictions.json

      - name: Guard production boundary
        run: |
          git diff 9dec1ef0beb666c638ea75f3b58b7a28eed5bf08...HEAD --name-only > /tmp/fractional-settlement/changed-files.txt
          if grep -E '^(src/|profiles/)' /tmp/fractional-settlement/changed-files.txt; then
            echo 'Research branch modified production src/ or profiles/' >&2
            exit 1
          fi

      - name: Verify replay outputs
        run: |
          test -s /tmp/fractional-settlement/fractional-settlement.json
          test -s /tmp/fractional-settlement/REPORT.md
          test -s /tmp/fractional-settlement/quantization-aware-refit.json
          test -s /tmp/fractional-settlement/QUANTIZATION_AWARE_REFIT.md
          test -s /tmp/fractional-settlement/haggag-postdrill-shape-predictions.json
          test -s /tmp/fractional-settlement/changed-files.txt

      - name: Upload research artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fractional-settlement-research
          path: /tmp/fractional-settlement
          if-no-files-found: error
          retention-days: 30
