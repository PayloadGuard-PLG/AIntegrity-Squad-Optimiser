name: Resource Coach Log

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'calibration/resource-coach-log/**'
      - 'calibration/longitudinal-corpus/**'
      - 'tools/resource-coach-v2/aggregate-experiment-log.mjs'
      - 'tools/resource-coach-v2/ingest-experiment.mjs'
      - 'tools/resource-coach-v2/analyze-longitudinal-corpus.mjs'
      - 'tests/longitudinal-corpus-analysis-test.mjs'
      - '.github/workflows/resource-coach-log.yml'
  push:
    branches: [main]
    paths:
      - 'calibration/resource-coach-log/**'
      - 'calibration/longitudinal-corpus/**'
      - 'tools/resource-coach-v2/aggregate-experiment-log.mjs'
      - 'tools/resource-coach-v2/ingest-experiment.mjs'
      - 'tools/resource-coach-v2/analyze-longitudinal-corpus.mjs'
      - 'tests/longitudinal-corpus-analysis-test.mjs'
      - '.github/workflows/resource-coach-log.yml'

permissions:
  contents: read

jobs:
  verify-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check tools/resource-coach-v2/ingest-experiment.mjs
          node --check tools/resource-coach-v2/aggregate-experiment-log.mjs
          node --check tools/resource-coach-v2/analyze-longitudinal-corpus.mjs
          node --check tests/longitudinal-corpus-analysis-test.mjs

      - name: Longitudinal analyzer semantic regression
        run: node --test tests/longitudinal-corpus-analysis-test.mjs

      - name: Aggregate immutable experiments
        run: |
          rm -rf /tmp/resource-coach-generated
          node tools/resource-coach-v2/aggregate-experiment-log.mjs \
            calibration/resource-coach-log/runs \
            /tmp/resource-coach-generated
          cat /tmp/resource-coach-generated/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Analyze complete longitudinal corpus and all experiment runs
        run: |
          rm -rf /tmp/resource-coach-longitudinal
          node tools/resource-coach-v2/analyze-longitudinal-corpus.mjs \
            calibration/longitudinal-corpus/corpus-v1.json.gz.b64 \
            calibration/resource-coach-log/runs \
            /tmp/resource-coach-longitudinal
          cat /tmp/resource-coach-longitudinal/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify corpus-wide analysis semantics
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/resource-coach-longitudinal/summary.json','utf8'));
          if(s.analysisScope!=='all-corpus-states-and-all-immutable-runs') throw new Error('Longitudinal analysis is not corpus-wide.');
          if(!s.integrity?.noInferredCausalTransitions) throw new Error('Analyzer inferred causal transitions absent from source evidence.');
          if((s.counts?.players??0)<1 || (s.counts?.playerStates??0)<1) throw new Error('Corpus contains no player-state evidence.');
          if((s.counts?.observedResponseRows??0)<1) throw new Error('Corpus contains no observed coach-response rows.');
          if((s.counts?.uniqueObservedResponseRows??0)>(s.counts?.observedResponseRows??0)) throw new Error('Unique response count exceeds raw response count.');
          NODE

      - name: Verify immutable-ingest idempotence
        run: |
          mkdir -p /tmp/resource-coach-runs
          first="$(find calibration/resource-coach-log/runs -maxdepth 1 -name '*.json' | sort | head -n 1)"
          test -n "$first"
          node tools/resource-coach-v2/ingest-experiment.mjs "$first" /tmp/resource-coach-runs
          node tools/resource-coach-v2/ingest-experiment.mjs "$first" /tmp/resource-coach-runs

      - name: Upload normalized and longitudinal analysis artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-coach-analysis-${{ github.sha }}
          path: |
            /tmp/resource-coach-generated
            /tmp/resource-coach-longitudinal
          if-no-files-found: error
          retention-days: 14
