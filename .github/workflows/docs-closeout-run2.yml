name: Execute Resource Coach V2 docs closeout

on:
  push:
    branches:
      - docs/resource-coach-v2-postmerge-20260913

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: docs/resource-coach-v2-postmerge-20260913
          fetch-depth: 0

      - name: Execute canonical documentation patch
        shell: bash
        run: |
          python - <<'PYRUN'
          from pathlib import Path

          src = Path('.github/workflows/docs-closeout-20260913.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          raw = src[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          code = code.replace("                    'WHITEPAPER.md','FORMULAS.md','KNOWN_ISSUES.md','ASSUMPTIONS.md',", "                    'WHITEPAPER.md','FORMULAS.md','KNOWN_ISSUES.md',")
          exec(compile(code, 'docs-closeout-20260913.py', 'exec'))
          PYRUN

          git diff --check
          git status --short

      - name: Commit documentation closeout
        shell: bash
        run: |
          rm -f .github/workflows/docs-closeout-20260913.yml .github/workflows/docs-closeout-run2.yml
          git config user.name "AIntegrity Docs Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: close Resource Coach V2 merge handover [skip ci]"
          git push origin HEAD:docs/resource-coach-v2-postmerge-20260913
